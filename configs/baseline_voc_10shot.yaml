seed: 3407

voc_root: ~/epfs/07_FSOD_LLM/datasets/VOCdevkit
output_root: ./data/voc_fsod_split1_10shot

novel_classes:
  - bird
  - bus
  - cow
  - motorbike
  - sofa

shot: 10

model: yolo11s.pt
image_size: 640
device: 0
workers: 16
runs_dir: ./runs/fsod_baseline

epochs:
  base: 100
  finetune: 100

batch_size:
  base: 64
  finetune: 4

lr0:
  base: 0.01
  finetune: 0.0005

freeze:
  backbone: 10

# --- Few-shot finetune anti-overfitting ---
patience: 0            # disable early stopping; all runs train full epochs
cos_lr: true          # cosine LR scheduler (smooth decay)
lrf: 0.01             # final LR = lr0 * lrf = 5e-6
warmup_epochs: 5      # longer warmup for few-shot stability
close_mosaic: 15      # disable mosaic augmentation in last 15 epochs

replay:
  enabled: false
  base_images: 200