seed: 3407

voc_root: ~/epfs/07_FSOD_LLM/datasets/VOCdevkit
output_root: ./data/voc_fsod_split1_10shot_reviewed

novel_classes:
  - bird
  - bus
  - cow
  - motorbike
  - sofa

shot: 10

model: yolo11s.pt
image_size: 640
device: 0
workers: 16
runs_dir: ./runs/voc_fsod_10shot_vlm

epochs:
  base: 100
  finetune: 200

batch_size:
  base: 64
  finetune: 4

lr0:
  base: 0.01
  finetune: 0.0005

freeze:
  backbone: 10

patience:
  finetune: 30

replay:
  enabled: false
  base_images: 200

florence2:
  alpha: 0.7           # blend: alpha * raw_proto + (1-alpha) * film_output
  film_hidden_dim: 128  # smaller network to reduce overfitting (was 256)
  film_epochs: 300      # fewer epochs to reduce overfitting (was 1000)
  film_weight_decay: 0.05  # stronger L2 regularization (was 0.01)